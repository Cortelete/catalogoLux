
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luxury Studio Joyci Almeida - Catálogo Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0d0d0d;
        color: #EAEAEA;
      }
      .font-serif {
        font-family: 'Cormorant Garamond', serif;
      }
      .font-display {
        font-family: 'Playfair Display', serif;
      }
      .glow-effect:hover {
        box-shadow: 0 0 15px rgba(217, 119, 6, 0.4), 0 0 5px rgba(217, 119, 6, 0.2);
      }
      
      /* Custom Scrollbar Styles */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #1a1a1a;
      }
      ::-webkit-scrollbar-thumb {
        background-color: #4b5563;
        border-radius: 20px;
      }
       ::-webkit-scrollbar-thumb:hover {
        background-color: #ca8a04; /* amber-500 */
      }

      /* Page transition animations */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes fadeInAndUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animate-fade-in {
        animation: fadeIn 0.6s ease-in-out forwards;
      }
      
      .animate-fade-in-up {
         animation: fadeInAndUp 0.8s ease-in-out forwards;
      }

      /* Custom input styles for date picker icon */
      input[type="date"]::-webkit-calendar-picker-indicator,
      input[type="time"]::-webkit-calendar-picker-indicator {
          filter: invert(0.8) brightness(1) sepia(1) hue-rotate(320deg) saturate(3);
          cursor: pointer;
      }
    </style>
